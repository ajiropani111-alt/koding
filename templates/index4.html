<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Penjualan Pisang Cavendish</title>
    <!-- CSS Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Nanti isi tabel dan modal form di sini -->

    <!-- JS Bootstrap 5 (Di paling bawah sebelum tutup body) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body> <div class="container mt-5">

    <!-- Judul Halaman -->
    <div class="text-center mb-4">
        <h2 class="text-primary">SISTEM INFORMASI PENJUALAN PISANG CAVENDISH</h2>
        <p class="text-muted">Praktikum Pemrograman Komputer</p>
    </div>

    <!-- Card pembungkus tabel -->
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">DATA TRANSAKSI PENJUALAN</h5>
        </div>

        <div class="card-body">

            <!-- Tombol Tambah Data -->
            <div class="mb-3">
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalTambah">
                    Tambah Penjualan
                </button>
            </div>

            <!-- Tabel Data Penjualan -->
            <table class="table table-bordered table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>No Resi</th>
                        <th>Nama Pembeli</th>
                        <th>Jenis Pisang</th>
                        <th>Jumlah Sisir</th>
                        <th>Harga (Rp)</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in data %}
                    <tr>
                        <td>{{ item[0] }}</td>
                        <td>{{ item[1] }}</td>
                        <td>{{ item[2] }}</td>
                        <td>{{ item[3] }}</td>
                        <td>{{ item[4] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

        </div>
    </div>

</div>
</html> <!-- Modal Form Tambah Data -->
    <div class="modal fade" id="modalTambah" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <form action="/simpan" method="POST">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title">Tambah Data Penjualan</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">No Resi</label>
                            <input type="text" name="no_resi" class="form-control" placeholder="Contoh: RS-001" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nama Pembeli</label>
                            <input type="text" name="nama_pembeli" class="form-control" placeholder="Masukkan nama pembeli" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Jenis Pisang</label>
                            <input type="text" name="jenis_pisang" class="form-control" placeholder="Contoh: Cavendish Premium" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Jumlah Sisir</label>
                            <input type="number" name="jumlah_sisir" class="form-control" placeholder="Masukkan jumlah" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Harga (Rp)</label>
                            <input type="number" name="harga" class="form-control" placeholder="Masukkan harga" required>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="submit" class="btn btn-success">Simpan</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
